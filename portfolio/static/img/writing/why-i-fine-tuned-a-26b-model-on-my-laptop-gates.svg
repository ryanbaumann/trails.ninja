<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Mechanical checks for em-dashes, announcement phrasing, hype words, and repeated phrases stand as gates on the left; on the right, unweighted human judgments about truth, credit, and whether the piece should exist. The two never combine into one score.">
  <style>
    :root { --bg: #faf9f6; --surface: #ffffff; --ink: #111827; --faint: #5f6875; --line: #d9dde5; --accent: #3b82f6; --accent-ink: #2563eb; --block: #2563eb; --warn: #94a3b8; }
    @media (prefers-color-scheme: dark) { :root { --bg: #030712; --surface: #111827; --ink: #f9fafb; --faint: #aeb7c4; --line: #334155; --accent: #60a5fa; --accent-ink: #93c5fd; --block: #60a5fa; --warn: #64748b; } }
  </style>
  <defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="var(--line)" stroke-width="1" opacity="0.28"/></pattern></defs>
  <rect width="1200" height="620" fill="var(--bg)"/>
  <rect width="1200" height="620" fill="url(#grid)"/>
  <rect width="1200" height="8" fill="var(--accent)"/>
  <rect x="1" y="1" width="1198" height="618" fill="none" stroke="var(--line)" stroke-width="2"/>

  <text x="70" y="76" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="25" font-weight="700" letter-spacing="1.8" fill="var(--accent-ink)">WHAT A REGEX DECIDES, AND WHAT DOES NOT</text>
  <text x="70" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="720" letter-spacing="-0.5" fill="var(--ink)">Gates in front of one judgment, never blended into a score.</text>

  <!-- Divider -->
  <rect x="592" y="176" width="6" height="360" rx="3" fill="var(--accent)"/>

  <!-- Left: gates -->
  <text x="70" y="206" font-family="ui-monospace, monospace" font-size="20" font-weight="700" letter-spacing="1.5" fill="var(--faint)">GATES · RUN FIRST · IN CI</text>
  <rect x="70" y="228" width="330" height="56" rx="8" fill="var(--surface)" stroke="var(--block)" stroke-width="3"/>
  <text x="94" y="264" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="var(--block)">W-EMDASH</text>
  <text x="416" y="264" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" fill="var(--faint)">error</text>
  <rect x="70" y="298" width="330" height="56" rx="8" fill="var(--surface)" stroke="var(--block)" stroke-width="3"/>
  <text x="94" y="334" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="var(--block)">W-ANNOUNCE</text>
  <text x="416" y="334" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" fill="var(--faint)">error</text>
  <rect x="70" y="368" width="330" height="56" rx="8" fill="var(--surface)" stroke="var(--block)" stroke-width="3"/>
  <text x="94" y="404" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="var(--block)">W-HYPE</text>
  <text x="416" y="404" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" fill="var(--faint)">error</text>
  <rect x="70" y="438" width="330" height="56" rx="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="94" y="474" font-family="ui-monospace, monospace" font-size="24" fill="var(--warn)">W-STOCK-PHRASE</text>
  <text x="416" y="474" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" fill="var(--faint)">warn</text>

  <!-- Arrow across the divider -->
  <line x1="500" y1="536" x2="686" y2="536" stroke="var(--faint)" stroke-width="2"/>
  <path d="M 686 536 l -12 -7 l 0 14 z" fill="var(--faint)"/>
  <text x="500" y="576" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="var(--faint)">pass all four, then a person reads it</text>

  <!-- Right: human judgment -->
  <text x="646" y="206" font-family="ui-monospace, monospace" font-size="20" font-weight="700" letter-spacing="1.5" fill="var(--accent-ink)">JUDGMENT · STAYS WITH A PERSON</text>
  <rect x="646" y="228" width="484" height="266" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="676" y="278" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="var(--ink)">Does the opening land on real friction?</text>
  <text x="676" y="330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="var(--ink)">Is the number real?</text>
  <text x="676" y="382" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="var(--ink)">Is the credit honest?</text>
  <text x="676" y="434" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="var(--ink)">Should this exist at all?</text>
  <line x1="676" y1="458" x2="1100" y2="458" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 6"/>
  <text x="676" y="482" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-style="italic" fill="var(--faint)">unweighted, unaveraged, not a score</text>
</svg>
