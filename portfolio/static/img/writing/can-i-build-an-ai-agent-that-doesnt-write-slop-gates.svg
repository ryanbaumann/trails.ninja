<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Four mechanical checks run first in CI: em-dashes, announcement phrasing, hype adjectives, and stock phrases. Everything they cannot decide stays with a person: whether the opening lands on real friction, whether the number is real, whether the credit is honest, and whether the piece should exist. The two are never blended into a score.">
  <style>
    :root { --bg: #faf9f6; --surface: #ffffff; --ink: #111827; --faint: #5f6875; --line: #d9dde5; --accent: #3b82f6; --accent-ink: #2563eb; --block: #2563eb; --warn: #7c8698; }
    @media (prefers-color-scheme: dark) { :root { --bg: #030712; --surface: #111827; --ink: #f9fafb; --faint: #aeb7c4; --line: #334155; --accent: #60a5fa; --accent-ink: #93c5fd; --block: #60a5fa; --warn: #94a3b8; } }
    .eyebrow { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 28px; font-weight: 700; letter-spacing: 1.6px; }
    .deck { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 40px; font-weight: 720; letter-spacing: -0.6px; fill: var(--ink); }
    .col { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 28px; font-weight: 700; letter-spacing: 1.5px; }
    .gate { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 28px; font-weight: 700; fill: var(--block); }
    .ask { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 29px; fill: var(--ink); }
    .note { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 28px; fill: var(--faint); }
  </style>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="var(--line)" stroke-width="1" opacity="0.28"/></pattern>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--faint)"/></marker>
  </defs>
  <rect width="1200" height="675" fill="var(--bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="8" fill="var(--accent)"/>
  <rect x="1" y="1" width="1198" height="673" fill="none" stroke="var(--line)" stroke-width="2"/>

  <text x="70" y="84" class="eyebrow" fill="var(--accent-ink)">WHAT A REGEX DECIDES, AND WHAT DOES NOT</text>
  <text x="70" y="140" class="deck">Gates in front of judgment, never blended in.</text>

  <!-- Left: gates -->
  <text x="70" y="212" class="col" fill="var(--faint)">GATES · IN CI</text>
  <rect x="70" y="234" width="386" height="66" rx="9" fill="var(--surface)" stroke="var(--block)" stroke-width="3"/>
  <text x="98" y="277" class="gate">W-EMDASH</text>
  <rect x="70" y="316" width="386" height="66" rx="9" fill="var(--surface)" stroke="var(--block)" stroke-width="3"/>
  <text x="98" y="359" class="gate">W-ANNOUNCE</text>
  <rect x="70" y="398" width="386" height="66" rx="9" fill="var(--surface)" stroke="var(--block)" stroke-width="3"/>
  <text x="98" y="441" class="gate">W-HYPE</text>
  <rect x="70" y="480" width="386" height="66" rx="9" fill="var(--surface)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="98" y="523" class="gate" style="fill: var(--warn)">W-STOCK-PHRASE</text>

  <!-- Divider -->
  <rect x="530" y="212" width="6" height="334" rx="3" fill="var(--accent)"/>

  <!-- Right: judgment -->
  <text x="588" y="212" class="col" fill="var(--accent-ink)">JUDGMENT · A PERSON</text>
  <rect x="588" y="234" width="542" height="312" rx="12" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="620" y="292" class="ask">Does it land on real friction?</text>
  <text x="620" y="356" class="ask">Is the number real?</text>
  <text x="620" y="420" class="ask">Is the credit honest?</text>
  <text x="620" y="484" class="ask">Should this exist at all?</text>

  <!-- Flow -->
  <line x1="70" y1="600" x2="556" y2="600" stroke="var(--faint)" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="588" y="610" class="note">pass all four, then a person reads it</text>
</svg>
