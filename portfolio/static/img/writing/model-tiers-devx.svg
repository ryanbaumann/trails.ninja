<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The same held-out task runs across Deep, Balanced, and Fast profiles while success, retries, latency, tokens, and cost are measured.">
  <style>
    :root { --bg: #faf9f6; --surface: #ffffff; --ink: #111827; --faint: #5f6875; --line: #d9dde5; --accent: #3b82f6; --accent-ink: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #030712; --surface: #111827; --ink: #f9fafb; --faint: #aeb7c4; --line: #334155; --accent: #60a5fa; --accent-ink: #93c5fd; } }</style>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="var(--line)" stroke-width="1" opacity="0.28"/></pattern>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/></marker>
  </defs>
  <rect width="1200" height="675" fill="var(--bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="8" fill="var(--accent)"/>
  <rect x="1" y="1" width="1198" height="673" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text x="70" y="86" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="28" font-weight="700" letter-spacing="2" fill="var(--accent-ink)">THE ROUTING SCOREBOARD</text>
  <text x="70" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="750" letter-spacing="-1" fill="var(--ink)">Cheaper only counts when quality holds</text>
  <text x="95" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="var(--faint)">same held-out task · same acceptance checks</text>
  <rect x="95" y="278" width="250" height="72" rx="16" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
    <text x="220" y="325" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="750" fill="var(--ink)">Deep</text>
    <path d="M 357 314 H 476" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#tip)"/>
  <rect x="95" y="382" width="250" height="72" rx="16" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
    <text x="220" y="429" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="750" fill="var(--ink)">Balanced</text>
    <path d="M 357 418 H 476" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#tip)"/>
  <rect x="95" y="486" width="250" height="72" rx="16" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
    <text x="220" y="533" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="750" fill="var(--ink)">Fast</text>
    <path d="M 357 522 H 476" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#tip)"/>
  <rect x="490" y="316" width="250" height="176" rx="22" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>
  <text x="615" y="388" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="var(--accent-ink)">QUALITY</text>
  <text x="615" y="430" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="750" fill="var(--ink)">Pass or stop</text>
  <path d="M 752 404 H 820" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#tip)"/>
  <rect x="834" y="300" width="280" height="208" rx="22" fill="var(--ink)"/>
  <text x="974" y="358" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="var(--bg)">MEASURE</text>
  <text x="974" y="405" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="29" fill="var(--bg)">retries · latency</text>
  <text x="974" y="449" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="29" fill="var(--bg)">tokens · cost</text>
  <text x="600" y="628" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="28" fill="var(--faint)">publish only after repeated runs clear the quality bar</text>
</svg>
