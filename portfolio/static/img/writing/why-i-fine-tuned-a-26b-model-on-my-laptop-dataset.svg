<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Dataset evolution comparison: The initial 117 training examples with repetitive templates and unmasked loss versus the final 218 paragraph-level micro-pairs across 111 Edits, 54 Drafts, 30 Critiques, and 19 Headlines.">
  <style>
    :root { --bg: #faf9f6; --surface: #ffffff; --ink: #111827; --faint: #5f6875; --line: #d9dde5; --accent: #3b82f6; --accent-ink: #2563eb; --edit: #2563eb; --draft: #10b981; --critique: #f59e0b; --headline: #8b5cf6; --present: #64748b; }
    @media (prefers-color-scheme: dark) { :root { --bg: #030712; --surface: #111827; --ink: #f9fafb; --faint: #aeb7c4; --line: #334155; --accent: #60a5fa; --accent-ink: #93c5fd; --edit: #60a5fa; --draft: #34d399; --critique: #fbbf24; --headline: #a78bfa; --present: #94a3b8; } }
  </style>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="var(--line)" stroke-width="1" opacity="0.28"/></pattern>
  </defs>
  <rect width="1200" height="640" fill="var(--bg)"/>
  <rect width="1200" height="640" fill="url(#grid)"/>
  <rect width="1200" height="8" fill="var(--accent)"/>
  <rect x="1" y="1" width="1198" height="638" fill="none" stroke="var(--line)" stroke-width="2"/>

  <text x="70" y="70" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="23" font-weight="700" letter-spacing="1.8" fill="var(--accent-ink)">DATASET EVOLUTION · 218 PARAGRAPH MICRO-PAIRS</text>
  <text x="70" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="720" letter-spacing="-0.5" fill="var(--ink)">From templated macro slices to 218 rich task pairs</text>

  <!-- Section 1: Top Bar (218 Micro-Pairs Breakdown) -->
  <!-- Total width: 1030px. 111 edit (525px), 54 draft (255px), 30 critique (142px), 19 headline (90px), 4 present (18px) -->
  <text x="70" y="175" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19" font-weight="700" letter-spacing="1.2" fill="var(--faint)">ROUND 4 DATASET: 218 SAMPLES (PARAGRAPH-LEVEL 100–250 WORDS)</text>
  
  <rect x="70" y="195" width="525" height="74" fill="var(--edit)"/>
  <rect x="595" y="195" width="255" height="74" fill="var(--draft)"/>
  <rect x="850" y="195" width="142" height="74" fill="var(--critique)"/>
  <rect x="992" y="195" width="90" height="74" fill="var(--headline)"/>
  <rect x="1082" y="195" width="18" height="74" fill="var(--present)"/>
  <rect x="70" y="195" width="1030" height="74" fill="none" stroke="var(--line)" stroke-width="2"/>

  <!-- Bar labels -->
  <text x="85" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">111 Edit (51%)</text>
  <text x="610" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">54 Draft (25%)</text>
  <text x="860" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">30 Critique</text>
  <text x="998" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">19 Titles</text>

  <!-- Legend / Details Grid -->
  <rect x="70" y="300" width="245" height="180" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="70" y="300" width="245" height="5" rx="2" fill="var(--edit)"/>
  <text x="88" y="336" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="var(--ink)">111 Edit Pairs</text>
  <text x="88" y="368" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="var(--faint)">Preserves factual spine</text>
  <text x="88" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="var(--faint)">Transforms corporate hype</text>
  <text x="88" y="420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="var(--faint)">Converts voice dictation</text>
  <text x="88" y="456" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="var(--edit)">0 Metric Hallucinations</text>

  <rect x="332" y="300" width="245" height="180" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="332" y="300" width="245" height="5" rx="2" fill="var(--draft)"/>
  <text x="350" y="336" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="var(--ink)">54 Draft Pairs</text>
  <text x="350" y="368" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="var(--faint)">Section-bounded hooks</text>
  <text x="350" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="var(--faint)">Growth-backwards progression</text>
  <text x="350" y="420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="var(--faint)">100–250 words per pair</text>
  <text x="350" y="456" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="var(--draft)">Zero Memory Warnings</text>

  <rect x="594" y="300" width="245" height="180" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="594" y="300" width="245" height="5" rx="2" fill="var(--critique)"/>
  <text x="612" y="336" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="var(--ink)">30 Critiques</text>
  <text x="612" y="368" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="var(--faint)">Context-tailored diagnosis</text>
  <text x="612" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="var(--faint)">Catches AI cliches</text>
  <text x="612" y="420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="var(--faint)">Offers line-by-line fixes</text>
  <text x="612" y="456" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="var(--critique)">Dynamic Remediation</text>

  <rect x="855" y="300" width="245" height="180" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="855" y="300" width="245" height="5" rx="2" fill="var(--headline)"/>
  <text x="873" y="336" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="var(--ink)">19 Headlines</text>
  <text x="873" y="368" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="var(--faint)">Thesis-first framing</text>
  <text x="873" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="var(--faint)">Misconception hooks</text>
  <text x="873" y="420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="var(--faint)">6–8 variants per topic</text>
  <text x="873" y="456" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="var(--headline)">No Clickbait Slop</text>

  <!-- Footer summary -->
  <rect x="70" y="520" width="6" height="66" rx="3" fill="var(--accent)"/>
  <text x="102" y="548" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="var(--ink)">Paragraph-level slicing eliminated sequence truncation and dropped Metal RAM from 36.8 GB to 24.5 GB.</text>
  <text x="102" y="576" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="var(--faint)">Training for 150 iterations with --mask-prompt locked in authentic voice with zero template replication.</text>
</svg>
