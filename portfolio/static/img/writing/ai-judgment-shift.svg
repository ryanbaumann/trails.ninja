<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">The tool eats the middle of the work</title>
  <desc id="desc">Before the tool, most engineering time goes to running the cases and a little to judgment. After the tool, the mechanics collapse and judgment expands to fill what is left.</desc>
  <style>
    :root { --bg:#faf9f6; --ink:#111827; --muted:#5f6875; --line:#d9dde5; --accent:#3b82f6; --accent-ink:#2563eb; --soft:#eaf2ff; }
    @media (prefers-color-scheme:dark) { :root { --bg:#030712; --ink:#f9fafb; --muted:#aeb7c4; --line:#334155; --accent:#60a5fa; --accent-ink:#93c5fd; --soft:#12213b; } }
    .sans { font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .mono { font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; }
  </style>
  <defs>
    <clipPath id="barA"><rect x="70" y="235" width="1060" height="104" rx="16"/></clipPath>
    <clipPath id="barB"><rect x="70" y="415" width="1060" height="104" rx="16"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="var(--bg)"/>
  <rect width="1200" height="8" fill="var(--accent)"/>
  <rect x="1" y="1" width="1198" height="673" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text x="70" y="82" class="mono" font-size="25" font-weight="700" letter-spacing="2.5" fill="var(--accent-ink)">WHERE THE ENGINEERING HOURS GO</text>
  <text x="70" y="145" class="sans" font-size="50" font-weight="750" letter-spacing="-1.4" fill="var(--ink)">The tool eats the middle</text>

  <text x="70" y="212" class="mono" font-size="23" font-weight="700" letter-spacing="2" fill="var(--muted)">BEFORE THE TOOL</text>
  <g clip-path="url(#barA)" aria-label="Before the tool, most time goes to mechanics">
    <rect x="70" y="235" width="800" height="104" fill="var(--ink)"/>
    <rect x="870" y="235" width="260" height="104" fill="var(--soft)"/>
  </g>
  <rect x="70" y="235" width="1060" height="104" rx="16" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text x="470" y="298" text-anchor="middle" class="sans" font-size="34" font-weight="750" fill="var(--bg)">MECHANICS</text>
  <text x="1000" y="298" text-anchor="middle" class="sans" font-size="30" font-weight="750" fill="var(--ink)">JUDGMENT</text>

  <text x="70" y="392" class="mono" font-size="23" font-weight="700" letter-spacing="2" fill="var(--accent-ink)">AFTER THE TOOL</text>
  <g clip-path="url(#barB)" aria-label="After the tool, most time goes to judgment">
    <rect x="70" y="415" width="250" height="104" fill="var(--ink)"/>
    <rect x="320" y="415" width="810" height="104" fill="var(--soft)"/>
  </g>
  <rect x="70" y="415" width="1060" height="104" rx="16" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text x="195" y="477" text-anchor="middle" class="sans" font-size="25" font-weight="750" fill="var(--bg)">MECHANICS</text>
  <text x="725" y="477" text-anchor="middle" class="sans" font-size="34" font-weight="750" fill="var(--ink)">JUDGMENT</text>

  <text x="70" y="590" class="mono" font-size="22" fill="var(--muted)">judgment: set the constraint · pick the case that matters</text>
  <text x="70" y="628" class="mono" font-size="22" fill="var(--muted)">catch the confident error · sit in the system with your users</text>
</svg>
