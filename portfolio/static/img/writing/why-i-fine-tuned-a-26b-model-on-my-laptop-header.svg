<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Two iterations on Apple Silicon Metal: Round 1 with unmasked full sequence loss and 36.8 GB RAM that replicated prompt templates, versus Round 4 with completion-only loss masking and 218 micro-pairs running at 24.5 GB RAM with zero hallucinations.">
  <style>
    :root { --bg: #faf9f6; --surface: #ffffff; --ink: #111827; --faint: #5f6875; --line: #d9dde5; --accent: #3b82f6; --accent-ink: #2563eb; --muted: #94a3b8; --live: #10b981; --alert: #ef4444; }
    @media (prefers-color-scheme: dark) { :root { --bg: #030712; --surface: #111827; --ink: #f9fafb; --faint: #aeb7c4; --line: #334155; --accent: #60a5fa; --accent-ink: #93c5fd; --muted: #64748b; --live: #34d399; --alert: #f87171; } }
  </style>
  <defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="var(--line)" stroke-width="1" opacity="0.28"/></pattern></defs>
  <rect width="1200" height="675" fill="var(--bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="8" fill="var(--accent)"/>
  <rect x="1" y="1" width="1198" height="673" fill="none" stroke="var(--line)" stroke-width="2"/>

  <text x="70" y="76" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="700" letter-spacing="1.8" fill="var(--accent-ink)">LOCAL FINE-TUNING EVOLUTION · APPLE SILICON METAL</text>
  <text x="70" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="720" letter-spacing="-0.5" fill="var(--ink)">From unmasked prompt replay to 218 verified micro-pairs</text>

  <!-- Left panel: Round 1 unmasked loss -->
  <rect x="70" y="170" width="500" height="330" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <rect x="70" y="170" width="500" height="6" rx="3" fill="var(--muted)"/>
  <text x="102" y="218" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" font-weight="700" letter-spacing="1.5" fill="var(--faint)">ROUND 1 · UNMASKED FULL LOSS</text>
  <text x="102" y="270" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="var(--ink)">36.8 GB peak Metal RAM</text>
  <text x="102" y="312" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="var(--ink)">159 section-level macro slices</text>
  <text x="102" y="354" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="var(--ink)">Sequence warnings on &gt;2048 tok</text>
  <text x="102" y="396" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="var(--ink)">468 iterations (overtrained)</text>
  <line x1="102" y1="426" x2="538" y2="426" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 6"/>
  <text x="102" y="468" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700" fill="var(--alert)">Replicated prompt templates &amp; tags</text>

  <!-- Right panel: Round 4 masked micro-pairs -->
  <rect x="630" y="170" width="500" height="330" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="630" y="170" width="500" height="6" rx="3" fill="var(--accent)"/>
  <text x="662" y="218" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" font-weight="700" letter-spacing="1.5" fill="var(--accent-ink)">ROUND 4 · MASKED MICRO-PAIRS</text>
  <text x="662" y="270" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="var(--ink)">24.5 GB peak Metal RAM (-12.3 GB)</text>
  <text x="662" y="312" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="var(--ink)">218 paragraph-level micro-pairs</text>
  <text x="662" y="354" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="var(--ink)">--mask-prompt (completion loss)</text>
  <text x="662" y="396" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="var(--ink)">150 iters (2.5 epoch goldilocks)</text>
  <line x1="662" y1="426" x2="1098" y2="426" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 6"/>
  <text x="662" y="468" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700" fill="var(--live)">0 metric hallucinations · 0 em-dashes</text>

  <!-- Footer note -->
  <rect x="70" y="546" width="6" height="66" rx="3" fill="var(--accent)"/>
  <text x="102" y="576" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="var(--ink)">Completion-only loss masking and micro-pair slicing made local fine-tuning viable.</text>
  <text x="102" y="606" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="var(--faint)">Gemma 4 26B-A4B runs on Apple Silicon Metal with sub-second latency and zero data leakage.</text>
</svg>
