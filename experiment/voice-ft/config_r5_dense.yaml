# MLX LoRA fine-tuning, round 5, dense variant. Gemma 4 31B instead of 26B-A4B.
#
#   mlx_lm.lora --config experiment/voice-ft/config_r5_dense.yaml
#
# The argument for switching, in one line: 26B-A4B routes each token through about 4B
# active parameters, so a LoRA on it is adapting a thin slice of a wide model, and voice
# is exactly the kind of diffuse, everywhere-at-once property that gets spread across
# experts. A dense 31B puts every parameter on every token. Same family, same chat
# template, same Apache 2.0 licence, so nothing in training/ has to change.
#
# Cost on an M4 Pro 48 GB: mlx-community/gemma-4-31b-it-4bit is roughly 17-18 GB of
# weights. Round 4 peaked at 24.5 GB on the MoE. Expect this run to sit higher, so
# grad_checkpoint is on and num_layers is cut to 12. If it still swaps, drop
# max_seq_length to 1536 before touching rank; the micro-pairs are short.
#
# This is a hypothesis, not a result. Run both, grade both with the same suite, and
# compare with:
#   python3 scripts/voice_eval.py compare --baseline <moe>.json --candidate <dense>.json

model: "models/gemma-4-31b-it-4bit"
train: true
data: "./experiment/voice-ft/training"

fine_tune_type: lora
# Gemma 4 31B has 60 transformer layers (language_model.model.layers.0..59).
# num_layers=32 adapts the last half (~65M LoRA params at r=16). The 0.106%
# figure from num_layers=16 is only low as a percentage of 30.7B total params;
# absolute trainable count matters more for a 221-example fine-tune.
# grad_checkpoint was removed: it causes NaN at iter ~20 on 4bit quantized models
# in mlx-lm 0.31.3 (recomputed activations don't reconstruct cleanly). Memory
# budget is fine without it: 17-18 GB weights + 1536-token activations stays under
# 28 GB on a 48 GB M4 Pro.
num_layers: 20

iters: 300
batch_size: 1
max_seq_length: 1280
mask_prompt: true

learning_rate: 1.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 20
  warmup_init: 1.0e-8
  arguments: [1.0e-5, 300, 1.0e-7]

lora_parameters:
  rank: 16
  scale: 32.0
  dropout: 0.05

seed: 42
adapter_path: "./adapters/gemma-4-31b-ryan-voice-v6"
save_every: 50
# steps_per_eval:0 causes ZeroDivisionError. Use 9999 to skip mid-training eval.
# Same Metal compute graph crash as MoE. Eval runs after training via voice_eval.py.
steps_per_eval: 9999
steps_per_report: 10
val_batches: 1
