version: 2

# Every ecosystem groups its weekly minor and patch bumps into a single PR.
# Fifteen separate one-line PRs (2026-08) cost more review attention than the
# updates were worth. Majors stay ungrouped so each one gets its own review --
# dependabot-auto-merge.yml auto-merges the grouped minor/patch PRs on green CI
# and leaves majors for a human.
updates:
  - package-ecosystem: "npm"
    directory: "/demos/strava-explorer"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/demos/aqi-map"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/demos/isochrones"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
