name: CI Workflow

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to the same branch/PR supersedes the running check. Cancel the
# old run instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  discover-packages:
    name: Discover workspace packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm run check:labs && npm run check:content && npm run test:labs
      - id: packages
        run: echo "value=$(node scripts/list-ci-packages.mjs)" >> "$GITHUB_OUTPUT"

  package-checks:
    name: ${{ matrix.package }} checks
    needs: discover-packages
    runs-on: ubuntu-latest
    # Every job here finishes in under a minute when healthy. A tight timeout
    # turns a hang (see LEARNINGS.md, 2026-07-12 node --test entry) into a
    # fast red X instead of a 6-hour stuck run.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover-packages.outputs.packages) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          # The gateway is zero-dependency and has no lockfile; point the
          # cache at every lockfile that exists instead of the matrix path.
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        working-directory: ${{ matrix.package }}
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Linter
        working-directory: ${{ matrix.package }}
        run: npm run lint --if-present

      - name: Run Tests
        working-directory: ${{ matrix.package }}
        run: npm test --if-present

      - name: Build Application
        working-directory: ${{ matrix.package }}
        run: npm run build --if-present

  build-and-smoke:
    name: Build all apps + gateway smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secrets here: this job builds and smoke-tests the container's
    # contents with dummy/no keys (see scripts/build-local.mjs and
    # scripts/smoke.mjs), so it's safe to run on pull_request from forks.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Build every app (stages apps/<name>/ like the Dockerfile does)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: node scripts/build-local.mjs --allow-missing-artifacts

      - name: Validate lab manifest and cross-wiring
        run: npm run check:labs && npm run test:labs

      # Use `npm test` (not raw `node --test`): the npm script sets
      # NODE_ENV=test. The server also guards on NODE_TEST_CONTEXT now, but
      # belt and suspenders — a listening socket here hung CI for hours.
      - name: Run gateway unit tests
        working-directory: gateway
        run: npm test

      - name: Smoke test the gateway against the staged apps
        run: node scripts/smoke.mjs

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Layer-cached via the GitHub Actions cache: unchanged apps rebuild
      # from cache instead of re-running npm ci + vite build in every stage.
      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: fieldwork
          build-args: |
            VITE_STRAVA_CLIENT_ID=smoke-test-placeholder-client-id
            ALLOW_MISSING_ARTIFACTS=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built container
        run: |
          set -euo pipefail
          docker run --rm -d -p 8080:8080 --name fieldwork-smoke fieldwork
          trap 'docker rm -f fieldwork-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs fieldwork-smoke
              exit 1
            fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:8080 node scripts/smoke.mjs

  secret-scan:
    name: Secret Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret Scanner (Gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source=/repo --verbose --redact
